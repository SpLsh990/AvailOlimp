<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../static/style.css">
    <title>{{title}} | Регистрация</title>
</head>
<body>
<div class="decor-element decor-1"></div>
<div class="decor-element decor-2"></div>
<header>
    <div class="conteiner_for_header">
        <div class="header-left">
            <a href="{{url_for('main_bp.index')}}" class="logo">
                <img src="{{ url_for('main_bp.static', filename='images/logo.png') }}"
                     alt="AvailOlimp Logo"
                     class="logo-img">
                <span class="logo-text">AvailOlimp</span>
            </a>
            <a href="{{url_for('main_bp.index')}}">Главная</a>
            <a href="#">Задачи</a>
            <a href="#">Соревновательный режим</a>
        </div>
    </div>
</header>

<main class="register-container">
    <div class="register-card">
        <h2>Войти в аккаунт</h2>

        <div id="errorMessage" style="display: none;">
            <div class="error-message">
                <span id="errorText">Неверная почта или пароль</span>
            </div>
        </div>

        <form id="loginForm" class="register-form">
            <div class="input-group">
                <label for="email">Электронная почта</label>
                <div class="input-email">
                    <input type="email" id="email" name="email" placeholder="your@email.ru" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Пароль</label>
                <div class="input-password">
                    <input type="password" id="password" name="password" placeholder="··········" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                Войти
            </button>
        </form>

        <div class="divider">
            <span>или</span>
        </div>

        <button class="google-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                      fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                      fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                      fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                      fill="#EA4335"/>
            </svg>
            Продолжить с Google
        </button>

        <p class="login-link">
            Нет аккаунта?<a href="{{ url_for('main_bp.register') }}">Зарегистрируйся!</a>
        </p>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorContainer = document.getElementById('errorMessage');
        const errorTextSpan = document.getElementById('errorText');

        function showError(message) {
            errorTextSpan.textContent = message;
            errorContainer.style.display = 'block';

            setTimeout(() => {
                errorContainer.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            errorContainer.style.display = 'none';
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
            return emailRegex.test(email);
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email) {
                showError('Пожалуйста, введите email');
                emailInput.focus();
                return;
            }

            if (!isValidEmail(email)) {
                showError('Пожалуйста, введите корректный email адрес');
                emailInput.focus();
                return;
            }

            if (!password) {
                showError('Пожалуйста, введите пароль');
                passwordInput.focus();
                return;
            }

            submitBtn.disabled = true;
            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = 'Вход...';

            hideError();

            try {
                const response = await fetch('/login.html', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = data.redirect_url || '/';
                } else {
                    if (data.message === 'Current user does not exist') {
                        showError('Пользователь с таким email не найден');
                        emailInput.focus();
                    } else if (data.message === 'Wrong answer') {
                        showError('Неверный пароль');
                        passwordInput.value = '';
                        passwordInput.focus();
                    } else if (data.message === 'Invalid email format') {
                        showError('Неверный формат email');
                        emailInput.focus();
                    } else {
                        showError(data.message || 'Неверная почта или пароль');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Произошла ошибка сервера. Попробуйте позже.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }
        });

        emailInput.addEventListener('input', hideError);
        passwordInput.addEventListener('input', hideError);
    });
</script>
</body>
</html>
