<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../static/style.css">
    <title>{{title}} | Регистрация</title>
</head>
<body>
    <div class="decor-element decor-1"></div>
    <div class="decor-element decor-2"></div>

    <header>
        <div class="conteiner_for_header">
            <div class="header-left">
                <a href="{{url_for('main_bp.index')}}">Главная</a>
                <a href="#">Задачи</a>
                <a href="#">Соревновательный режим</a>
            </div>
            <a href="{{ url_for('main_bp.register') }}" class="register-btn">Зарегистрироваться</a>
        </div>
    </header>

    <main class="register-container">
        <div class="register-card">
            <h2>Создать аккаунт</h2>
            <p class="register-subtitle">Присоединяйся к сообществу олимпиадников</p>

            <form method="post" class="register-form">
                <div class="input-group">
                    <label for="email">Электронная почта</label>
                    <div class="input-email">
                        <input type="email" id="email" name="email" placeholder="your@email.ru" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Пароль</label>
                    <div class="input-password">
                        <input type="password" id="password" name="password" placeholder="··········" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="nickname">Никнейм</label>
                    <div class="input-email">
                        <input type="text" id="nickname" name="nickname" placeholder="LutiyPetya" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Регистрация
                </button>
            </form>

            <div class="divider">
                <span>или</span>
            </div>

            <button class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Продолжить с Google
            </button>

            <p class="login-link">
                Уже есть аккаунт? <a href="#">Войти</a>
            </p>
        </div>
    </main>
</body>
</html>
