<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../static/style.css">
    <title>{{title}} | Регистрация</title>
    <style>
        /* Стили для подсказки о пароле */
        .password-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .password-hint-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
        }

        .password-hint-item.valid {
            color: #4ade80;
        }

        .password-hint-item.invalid {
            color: #f87171;
        }

        .hint-icon {
            font-size: 0.8rem;
        }

        .password-hint-title {
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 3px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="decor-element decor-1"></div>
<div class="decor-element decor-2"></div>

<header>
    <div class="conteiner_for_header">
        <div class="header-left">
            <a href="{{url_for('main_bp.index')}}" class="logo">
                <img src="{{ url_for('main_bp.static', filename='images/logo.png') }}"
                     alt="AvailOlimp Logo"
                     class="logo-img">
                <span class="logo-text">AvailOlimp</span>
            </a>
            <a href="{{url_for('main_bp.index')}}">Главная</a>
            <a href="#">Задачи</a>
            <a href="#">Соревновательный режим</a>
        </div>
    </div>
</header>

<main class="register-container">
    <div class="register-card">
        <h2>Создать аккаунт</h2>

        <div id="errorMessage" style="display: none;">
            <div class="error-message">
                <span id="errorText"></span>
            </div>
        </div>

        <form id="registerForm" class="register-form">
            <div class="input-group">
                <label for="email">Электронная почта</label>
                <div class="input-email">
                    <input type="email" id="email" name="email" placeholder="your@email.ru" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Пароль</label>
                <div class="input-password">
                    <input type="password" id="password" name="password" placeholder="··········" required>
                </div>
                <!-- Подсказка о требованиях к паролю -->
                <div class="password-hint">
                    <div class="password-hint-title">Пароль должен содержать:</div>
                    <div class="password-hint-item" id="hintLength">
                        <span class="hint-icon">•</span>
                        <span>Не менее 6 символов</span>
                    </div>
                    <div class="password-hint-item" id="hintLatin">
                        <span class="hint-icon">•</span>
                        <span>Только латинские буквы (A-Z, a-z)</span>
                    </div>
                    <div class="password-hint-item" id="hintDigits">
                        <span class="hint-icon">•</span>
                        <span>Хотя бы одну цифру (0-9)</span>
                    </div>
                    <div class="password-hint-item" id="hintSpecial">
                        <span class="hint-icon">•</span>
                        <span>Хотя бы один спецсимвол (!@#$%^&* и т.д.)</span>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Подтвердите пароль</label>
                <div class="input-password">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="··········" required>
                </div>
            </div>

            <div class="input-group">
                <label for="nickname">Имя пользователя</label>
                <div class="input-email">
                    <input type="text" id="nickname" name="nickname" placeholder="ExampleNickname" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                Регистрация
            </button>
        </form>

        <div class="divider">
            <span>или</span>
        </div>

        <button class="google-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                      fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                      fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                      fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                      fill="#EA4335"/>
            </svg>
            Продолжить с Google
        </button>

        <p class="login-link">
            Уже есть аккаунт? <a href="{{ url_for('main_bp.login') }}">Войти</a>
        </p>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('registerForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const nicknameInput = document.getElementById('nickname');
        const submitBtn = document.getElementById('submitBtn');
        const errorContainer = document.getElementById('errorMessage');
        const errorTextSpan = document.getElementById('errorText');

        const hintLength = document.getElementById('hintLength');
        const hintLatin = document.getElementById('hintLatin');
        const hintDigits = document.getElementById('hintDigits');
        const hintSpecial = document.getElementById('hintSpecial');

        function showError(message) {
            errorTextSpan.textContent = message;
            errorContainer.style.display = 'block';

            setTimeout(() => {
                errorContainer.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            errorContainer.style.display = 'none';
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
            return emailRegex.test(email);
        }

        function updatePasswordHints() {
            const password = passwordInput.value;

            const isValidLength = password.length >= 6;
            updateHint(hintLength, isValidLength);

            const hasLatinLetters = /[a-zA-Z]/.test(password);
            updateHint(hintLatin, hasLatinLetters);

            const hasDigits = /\d/.test(password);
            updateHint(hintDigits, hasDigits);

            const hasSpecialChars = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(password);
            updateHint(hintSpecial, hasSpecialChars);

            const hasOnlyValidChars = /^[a-zA-Z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]*$/.test(password);
            if (password && !hasOnlyValidChars) {
                showError('Пароль может содержать только латинские буквы, цифры и специальные символы');
            }
        }

        function updateHint(element, isValid) {
            if (isValid) {
                element.classList.remove('invalid');
                element.classList.add('valid');
                element.querySelector('.hint-icon').textContent = '✓';
            } else {
                element.classList.remove('valid');
                element.classList.add('invalid');
                element.querySelector('.hint-icon').textContent = '•';
            }
        }

        function isValidPassword(password) {
            const hasLatinLetters = /[a-zA-Z]/.test(password);
            const hasDigits = /\d/.test(password);
            const hasSpecialChars = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(password);
            const hasOnlyValidChars = /^[a-zA-Z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]+$/.test(password);

            return password.length >= 6 && hasLatinLetters && hasDigits && hasSpecialChars && hasOnlyValidChars;
        }

        function isValidNickname(nickname) {
            return nickname.trim().length >= 3;
        }

        passwordInput.addEventListener('input', function() {
            updatePasswordHints();
            hideError();
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const nickname = nicknameInput.value.trim();

            if (!email) {
                showError('Пожалуйста, введите email');
                emailInput.focus();
                return;
            }

            if (!isValidEmail(email)) {
                showError('Пожалуйста, введите корректный email адрес');
                emailInput.focus();
                return;
            }

            if (!password) {
                showError('Пожалуйста, введите пароль');
                passwordInput.focus();
                return;
            }

            if (password.length < 6) {
                showError('Пароль должен содержать минимум 6 символов');
                passwordInput.focus();
                return;
            }

            const hasOnlyValidChars = /^[a-zA-Z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]+$/.test(password);
            if (!hasOnlyValidChars) {
                showError('Пароль может содержать только латинские буквы, цифры и специальные символы');
                passwordInput.focus();
                return;
            }

            const hasLatinLetters = /[a-zA-Z]/.test(password);
            const hasDigits = /\d/.test(password);
            const hasSpecialChars = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(password);

            if (!hasLatinLetters) {
                showError('Пароль должен содержать хотя бы одну латинскую букву (A-Z, a-z)');
                passwordInput.focus();
                return;
            }

            if (!hasDigits) {
                showError('Пароль должен содержать хотя бы одну цифру (0-9)');
                passwordInput.focus();
                return;
            }

            if (!hasSpecialChars) {
                showError('Пароль должен содержать хотя бы один специальный символ (!@#$%^&* и т.д.)');
                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                showError('Пароли не совпадают');
                confirmPasswordInput.focus();
                return;
            }

            if (!nickname) {
                showError('Пожалуйста, введите имя пользователя');
                nicknameInput.focus();
                return;
            }

            if (!isValidNickname(nickname)) {
                showError('Имя пользователя должно содержать минимум 3 символа');
                nicknameInput.focus();
                return;
            }

            submitBtn.disabled = true;
            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = 'Регистрация...';

            hideError();

            try {
                const response = await fetch('/form_register.html', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        nickname: nickname
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = data.redirect_url || '/';
                } else {
                    if (data.message === 'User already exists') {
                        showError('Пользователь с таким email или именем пользователя уже существует');
                    } else if (data.message === 'Invalid email format') {
                        showError('Неверный формат email');
                    } else {
                        showError(data.message || 'Ошибка регистрации. Попробуйте позже.');
                    }

                    passwordInput.value = '';
                    confirmPasswordInput.value = '';
                    updatePasswordHints();
                    passwordInput.focus();
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Произошла ошибка сервера. Попробуйте позже.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }
        });

        emailInput.addEventListener('input', hideError);
        confirmPasswordInput.addEventListener('input', hideError);
        nicknameInput.addEventListener('input', hideError);
    });
</script>
</body>
</html>
